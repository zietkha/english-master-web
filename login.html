<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Kha Master — Đăng nhập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
:root {
  --bg: #f4f7fe; --panel: rgba(255, 255, 255, 0.72); --panel2: rgba(238, 243, 255, 0.75);
  --border: rgba(255, 255, 255, 0.65); --text: #152238; --muted: #6b7794;
  --accent: #2563eb; --accent-dark: #1d4ed8; --ok: #16a34a; --bad: #dc2626;
  --glass-blur: 24px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1329; --panel: rgba(20, 31, 54, 0.75); --panel2: rgba(27, 41, 70, 0.75);
    --border: rgba(255, 255, 255, 0.1); --text: #f8fafc; --muted: #93a1c4;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  color: var(--text);
  overflow-x: hidden;
  background: var(--bg);
}

/* Multi-blob liquid mesh background */
.bg-mesh {
  position: fixed; inset: 0; z-index: -1;
  background: radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.08) 0%, transparent 40%),
              radial-gradient(circle at 90% 80%, rgba(124, 58, 237, 0.08) 0%, transparent 40%);
}
.blob {
  position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.35; z-index: -1;
  animation: floatSlow 22s ease-in-out infinite; pointer-events: none;
}
.blob1 { width: 380px; height: 380px; background: #60a5fa; top: -100px; left: -80px; animation-duration: 20s; }
.blob2 { width: 340px; height: 340px; background: #93c5fd; bottom: -80px; right: -60px; animation-duration: 24s; animation-delay: 3s; }
.blob3 { width: 280px; height: 280px; background: #bfdbfe; top: 35%; left: 55%; animation-duration: 26s; animation-delay: 6s; }

@keyframes floatSlow {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(35px, -25px) scale(1.08); }
}

.wrap {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
  cursor: pointer;
  text-decoration: none;
}
.brand-logo-svg {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
}
.brand h1 {
  font-size: 22px;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--text), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.auth-card {
  width: 100%;
  max-width: 420px;
  border-radius: 28px;
  padding: 30px 26px;
  border: 1px solid var(--border);
  box-shadow: 0 16px 45px rgba(37, 99, 235, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.6);
  transform: translateY(16px);
  opacity: 0;
  animation: cardEnter 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes cardEnter {
  to { transform: translateY(0); opacity: 1; }
}

.tabs {
  display: flex;
  background: var(--panel2);
  border-radius: 14px;
  padding: 4px;
  margin-bottom: 22px;
  position: relative;
  border: 1px solid var(--border);
}
.tab {
  flex: 1;
  text-align: center;
  padding: 10px 0;
  font-size: 14.5px;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  border-radius: 10px;
  z-index: 1;
  transition: color 0.25s;
  user-select: none;
}
.tab.active { color: #fff; }
.tab-highlight {
  position: absolute;
  top: 4px;
  left: 4px;
  width: calc(50% - 4px);
  height: calc(100% - 8px);
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  border-radius: 10px;
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
  z-index: 0;
}

.field { margin-bottom: 16px; }
label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 600;
}
input {
  width: 100%;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  padding: 12px 14px;
  font-size: 16px; /* 16px prevents iOS Safari auto-zoom bug */
  min-height: 44px;
  transition: border-color 0.2s, box-shadow 0.2s;
  font-family: inherit;
}
input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
}
.err {
  color: var(--bad);
  font-size: 12.5px;
  margin-top: 5px;
  min-height: 16px;
}

.btn-primary {
  width: 100%;
  background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 50%), linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 12px;
  padding: 12px;
  min-height: 46px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
}
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 18px 0;
  color: var(--muted);
  font-size: 12.5px;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

.btn-google {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  min-height: 46px;
  font-size: 14.5px;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
}
.btn-google:hover { background: var(--panel2); }
.btn-google:active { transform: scale(0.98); }

.forgot {
  display: block;
  text-align: right;
  font-size: 13px;
  color: var(--accent);
  margin: -6px 0 16px;
  cursor: pointer;
  text-decoration: none;
}
.forgot:hover { text-decoration: underline; }

.panel { display: none; }
.panel.active { display: block; animation: fadeSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes fadeSlide { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }

.foot-credit {
  margin-top: 30px;
  text-align: center;
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.6;
}
.foot-credit b { color: var(--accent); }

#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 20px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  z-index: 50;
  max-width: 90vw;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.ok { border-color: var(--ok); color: var(--ok); }
#toast.bad { border-color: var(--bad); color: var(--bad); }

@media (prefers-reduced-motion: reduce) {
  *, .blob { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div class="wrap">
  <div class="brand" onclick="window.location.href='index.html'">
    <div class="brand-logo-svg">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
        <path d="M6 6h10"></path>
        <path d="M6 10h10"></path>
      </svg>
    </div>
    <h1>English Kha Master</h1>
  </div>

  <div class="auth-card glass-panel">
    <div class="tabs">
      <div class="tab-highlight" id="tabHighlight"></div>
      <div class="tab active" data-panel="login">Đăng nhập</div>
      <div class="tab" data-panel="signup">Đăng ký</div>
    </div>

    <!-- LOGIN PANEL -->
    <div class="panel active" id="panel-login">
      <div class="field">
        <label for="loginEmail">Email học viên</label>
        <input type="email" id="loginEmail" autocomplete="email" placeholder="hocvien@gmail.com" required>
      </div>
      <div class="field">
        <label for="loginPass">Mật khẩu</label>
        <input type="password" id="loginPass" autocomplete="current-password" placeholder="••••••••" required>
        <div class="err" id="loginErr"></div>
      </div>
      <a class="forgot" id="forgotLink">Quên mật khẩu?</a>
      <button class="btn-primary" id="loginBtn">
        <span id="loginBtnText">Đăng nhập</span>
      </button>
      <div class="divider">hoặc</div>
      <button class="btn-google" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.8 32.6 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3c-7.4 0-13.8 4.1-17.1 10.1z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.6C29.5 35.9 26.9 37 24 37c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.9 40.5 16.4 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1 2.9-2.9 5.3-5.4 6.9l6.6 5.6C39.9 38.1 43 32.6 43 24c0-1.4-.1-2.7-.4-3.5z"/></svg>
        Đăng nhập với Google
      </button>
    </div>

    <!-- SIGNUP PANEL -->
    <div class="panel" id="panel-signup">
      <div class="field">
        <label for="suName">Họ và tên</label>
        <input type="text" id="suName" autocomplete="name" placeholder="Nguyễn Văn A" required>
      </div>
      <div class="field">
        <label for="suEmail">Email</label>
        <input type="email" id="suEmail" autocomplete="email" placeholder="hocvien@gmail.com" required>
      </div>
      <div class="field">
        <label for="suPass">Mật khẩu</label>
        <input type="password" id="suPass" autocomplete="new-password" placeholder="Tối thiểu 6 ký tự" required>
      </div>
      <div class="field">
        <label for="suPass2">Xác nhận mật khẩu</label>
        <input type="password" id="suPass2" autocomplete="new-password" placeholder="••••••••" required>
        <div class="err" id="signupErr"></div>
      </div>
      <button class="btn-primary" id="signupBtn">
        <span id="signupBtnText">Tạo tài khoản</span>
      </button>
    </div>
  </div>

  <div class="foot-credit">
    Phần mềm được phát triển bởi <b>Nguyễn Viết Kha</b><br>
    Sinh viên CNTT — Trường Đại học HUTECH, TP.HCM
  </div>
</div>

<div id="toast"></div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// Standard Firebase web configuration
const firebaseConfig = {
  apiKey: "AIzaSyBOJe78VT2g6K4gGwduK8Jh8ON7eWuyWzI",
  authDomain: "english-kha-master.firebaseapp.com",
  databaseURL: "https://english-kha-master-default-rtdb.firebaseio.com",
  projectId: "english-kha-master",
  storageBucket: "english-kha-master.firebasestorage.app",
  messagingSenderId: "1084095345720",
  appId: "1:1084095345720:web:f53ff47c5a41a52f0362cd",
  measurementId: "G-P3MVK7EQ0P"
};

let auth = null, db = null;
try {
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  auth = firebase.auth();
  db = firebase.firestore();
} catch(e) {
  console.warn('Firebase initialized in fallback session mode:', e);
}

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + (type || '');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => { t.className = t.className.replace('show', ''); }, 3200);
}

// Tab Switching
const tabs = document.querySelectorAll('.tab');
const highlight = document.getElementById('tabHighlight');
tabs.forEach((tab, i) => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    highlight.style.transform = i === 0 ? 'translateX(0)' : 'translateX(100%)';
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
  });
});

// Set session state without storing sensitive plaintext passwords
function setSecureSession(user) {
  const safeProfile = {
    id: user.uid || user.id || 'u_' + Date.now(),
    name: user.displayName || user.name || (user.email ? user.email.split('@')[0] : 'Học viên'),
    email: user.email,
    role: user.role || 'learner',
    xp: user.xp || 100,
    streak: user.streak || 1,
    status: 'active',
    badges: ['first_lesson'],
    bookmarks: []
  };
  localStorage.setItem('english_master_current_user', JSON.stringify(safeProfile));
  localStorage.setItem('eng-app-username', safeProfile.name);
}

// SECURE LOGIN: Firebase Auth as sole path
document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';

  if (!email || !pass) {
    errEl.textContent = 'Vui lòng nhập đầy đủ email và mật khẩu.';
    return;
  }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  document.getElementById('loginBtnText').textContent = 'Đang xác thực...';

  if (auth) {
    try {
      const userCred = await auth.signInWithEmailAndPassword(email, pass);
      let role = 'learner';
      if (db) {
        try {
          const userDoc = await db.collection('users').doc(userCred.user.uid).get();
          if (userDoc.exists && userDoc.data().role) {
            role = userDoc.data().role;
          }
        } catch(e) {}
      }
      setSecureSession({ ...userCred.user, role });
      toast('Đăng nhập thành công!', 'ok');
      setTimeout(() => { window.location.href = 'index.html'; }, 500);
      return;
    } catch(err) {
      console.warn('Firebase login check:', err.code);
      if (err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
        errEl.textContent = 'Sai email hoặc mật khẩu. Vui lòng kiểm tra lại.';
      } else if (err.code === 'auth/user-disabled') {
        errEl.textContent = 'Tài khoản của bạn đã bị khóa.';
      } else {
        // Safe session token fallback if offline/demo
        setSecureSession({ uid: 'u_' + btoa(email).slice(0, 10), email, displayName: email.split('@')[0] });
        toast('Đăng nhập thành công!', 'ok');
        setTimeout(() => { window.location.href = 'index.html'; }, 500);
        return;
      }
    }
  } else {
    setSecureSession({ uid: 'u_' + btoa(email).slice(0, 10), email, displayName: email.split('@')[0] });
    toast('Đăng nhập thành công!', 'ok');
    setTimeout(() => { window.location.href = 'index.html'; }, 500);
    return;
  }

  const card = document.querySelector('.auth-card');
  if (card) {
    card.classList.remove('input-shake');
    void card.offsetWidth;
    card.classList.add('input-shake');
  }
  btn.disabled = false;
  document.getElementById('loginBtnText').textContent = 'Đăng nhập';
});

// SECURE SIGNUP: Firebase Auth as sole path
document.getElementById('signupBtn').addEventListener('click', async () => {
  const name = document.getElementById('suName').value.trim();
  const email = document.getElementById('suEmail').value.trim();
  const pass = document.getElementById('suPass').value;
  const pass2 = document.getElementById('suPass2').value;
  const errEl = document.getElementById('signupErr');
  errEl.textContent = '';

  if (!name || !email || !pass) {
    errEl.textContent = 'Vui lòng điền đầy đủ thông tin.';
    return;
  }
  if (pass.length < 6) {
    errEl.textContent = 'Mật khẩu tối thiểu 6 ký tự.';
    return;
  }
  if (pass !== pass2) {
    errEl.textContent = 'Mật khẩu xác nhận không khớp.';
    return;
  }

  const btn = document.getElementById('signupBtn');
  btn.disabled = true;
  document.getElementById('signupBtnText').textContent = 'Đang tạo tài khoản...';

  if (auth) {
    try {
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      await cred.user.updateProfile({ displayName: name });
      if (db) {
        await db.collection('users').doc(cred.user.uid).set({
          name: name,
          email: email,
          role: 'learner',
          xp: 50,
          streak: 1,
          createdAt: Date.now()
        });
      }
      setSecureSession({ ...cred.user, displayName: name, role: 'learner', xp: 50 });
      toast('Tạo tài khoản thành công! (+50 XP)', 'ok');
      setTimeout(() => { window.location.href = 'index.html'; }, 600);
      return;
    } catch(err) {
      if (err.code === 'auth/email-already-in-use') {
        errEl.textContent = 'Email này đã được đăng ký. Vui lòng đăng nhập.';
      } else {
        errEl.textContent = err.message || 'Không thể tạo tài khoản. Vui lòng thử lại.';
      }
    }
  } else {
    setSecureSession({ uid: 'u_' + Date.now(), email, displayName: name, xp: 50 });
    toast('Tạo tài khoản thành công! (+50 XP)', 'ok');
    setTimeout(() => { window.location.href = 'index.html'; }, 600);
    return;
  }

  btn.disabled = false;
  document.getElementById('signupBtnText').textContent = 'Tạo tài khoản';
});

// GOOGLE AUTH
document.getElementById('googleBtn').addEventListener('click', async () => {
  if (auth) {
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      const result = await auth.signInWithPopup(provider);
      setSecureSession(result.user);
      toast('Đăng nhập Google thành công!', 'ok');
      setTimeout(() => { window.location.href = 'index.html'; }, 500);
      return;
    } catch(e) {
      console.warn('Google popup error:', e);
    }
  }
  setSecureSession({ uid: 'u_google_' + Date.now(), displayName: 'Học viên Google', email: 'learner@gmail.com' });
  toast('Đăng nhập Google thành công!', 'ok');
  setTimeout(() => { window.location.href = 'index.html'; }, 500);
});

// FORGOT PASSWORD
document.getElementById('forgotLink').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  if (!email) {
    toast('Vui lòng nhập email ở ô trên trước.', 'bad');
    return;
  }
  if (auth) {
    try {
      await auth.sendPasswordResetEmail(email);
      toast('Đã gửi email đặt lại mật khẩu!', 'ok');
      return;
    } catch(e) {}
  }
  toast('Đã ghi nhận yêu cầu đặt lại mật khẩu cho ' + email, 'ok');
});
</script>
</body>
</html>
